name: Backend quality

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duhochanoi
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: duhochanoi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duhochanoi -d duhochanoi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://duhochanoi:test-only-password@localhost:5432/duhochanoi_test
      NODE_ENV: test
      LOG_LEVEL: silent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply database migrations
        run: npm run migrate:up
      - name: Typecheck, test and build
        run: npm run check
