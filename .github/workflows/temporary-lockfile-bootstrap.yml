name: Temporary lockfile bootstrap

on:
  push:
    branches: [feature/cms-backend-foundation]
    paths:
      - ".github/workflows/temporary-lockfile-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/cms-backend-foundation
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate genuine npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Switch CI to deterministic install and remove bootstrap workflow
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = '.github/workflows/backend-quality.yml';
          const current = fs.readFileSync(path, 'utf8');
          const expected = 'run: npm install --no-audit --no-fund';
          if (!current.includes(expected)) {
            throw new Error('Expected install command was not found; refusing to edit CI blindly.');
          }
          fs.writeFileSync(path, current.replace(expected, 'run: npm ci --no-audit --no-fund'));
          NODE
          test -s package-lock.json
          rm .github/workflows/temporary-lockfile-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/backend-quality.yml .github/workflows/temporary-lockfile-bootstrap.yml
          git commit -m "build: lock npm dependencies and use npm ci"
          git push origin HEAD:feature/cms-backend-foundation
